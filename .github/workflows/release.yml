# v* etiketi itilince: testler + cihaz ikilisi + .deb + kurulum ISO'su (QEMU duman testiyle) + sunucu → GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q wireguard-tools openssh-client
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            merkez
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sh scripts/sunucu/merkez/tests/hepsi.sh python
      - run: cd merkez && cargo test --locked
      - run: cd merkez && cargo build --release --locked
      - run: cargo build --release --locked
      - run: sudo apt-get install -y -q xorriso cpio debian-keyring qemu-system-x86 qemu-utils ovmf netcat-openbsd
      - name: Paketle
        env:
          WFC_SSH_PUB: ${{ vars.WFC_SSH_PUB }}
        run: |
          s="${GITHUB_REF_NAME#v}"
          [ -n "$WFC_SSH_PUB" ] || { echo "WFC_SSH_PUB tanımlı değil (GitHub değişkeni): cihazlar root anahtarsız kurulurdu"; exit 1; }
          printf '%s\n' "$WFC_SSH_PUB" | ssh-keygen -lf - >/dev/null || { echo "WFC_SSH_PUB geçerli bir SSH açık anahtarı değil (GitHub değişkeni): sürüm derlenmedi"; exit 1; }
          mkdir -p dist
          install -m 755 target/release/wificorrect dist/wificorrect
          sh scripts/paket.sh target/release/wificorrect "$s" dist
          sh scripts/paket-test.sh "dist/wificorrect_${s}_amd64.deb"
          sh scripts/iso.sh "dist/wificorrect_${s}_amd64.deb" "$s" dist
          sudo chmod 666 /dev/kvm || true
          sh scripts/iso-test.sh "dist/wificorrect-kurulum-${s}.iso"
          # sunucu paketi: merkez Rust ikilisi sunucu/merkez/wificorrect-merkez olarak girer (kur.sh paketle aynı dizinden okur)
          sun="$RUNNER_TEMP/sunucu-paket"
          rm -rf "$sun" && mkdir -p "$sun" && cp -a scripts/sunucu "$sun/sunucu"
          install -m 755 merkez/target/release/wificorrect-merkez "$sun/sunucu/merkez/wificorrect-merkez"
          tar -czf "dist/wificorrect-sunucu-${GITHUB_REF_NAME}.tar.gz" --exclude=__pycache__ -C "$sun" sunucu
          (cd dist && sha256sum wificorrect *.deb *.iso *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wificorrect dist/*.deb dist/*.iso dist/*.tar.gz dist/SHA256SUMS \
            --title "WifiCorrect ${GITHUB_REF_NAME}" --generate-notes
