# Her push ve PR'da: cihaz yazılımı (Rust) ve yönetim merkezi (Python) testleri.
name: test
on:
  push:
  pull_request:

jobs:
  cihaz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # uzak erişim testleri anahtar üretir (wg, ssh-keygen)
      - run: sudo apt-get update -q && sudo apt-get install -y -q wireguard-tools openssh-client
      # cihazdaki Debian 13 derleyicisiyle aynı sürüm
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  merkez:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sh scripts/sunucu/merkez/tests/hepsi.sh python

  merkez-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: merkez
      - run: cd merkez && cargo test --locked
      # Sunucuya kurulacak ikili: testlerden sonra release derlemesi; merkez-kur.sh bu yapıtı sha'ya göre indirir
      - run: cd merkez && cargo build --release --locked
      - name: Yapıt hazırla
        run: |
          mkdir yapit
          install -m 755 merkez/target/release/wificorrect-merkez yapit/wificorrect-merkez
          (cd yapit && sha256sum wificorrect-merkez > wificorrect-merkez.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: wificorrect-merkez-${{ github.sha }}
          path: yapit/
          retention-days: 30
          if-no-files-found: error

  paket:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q wireguard-tools openssh-client
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: sh scripts/paket.sh target/release/wificorrect 0.0.0-ci dist
      - run: sh scripts/paket-test.sh dist/wificorrect_0.0.0-ci_amd64.deb
