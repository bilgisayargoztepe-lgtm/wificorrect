[package]
name = "wificorrect"
version = "0.4.27"
edition = "2021"
rust-version = "1.85"
description = "Kafeler için 5651 uyumlu, SMS doğrulamalı misafir internet sistemi"
publish = false

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# AP arayüzü aktarımı (src/ap_arayuz.rs): HTTPS AP'lere istemci, kendinden imzalı sertifika (tiny_http'nin sürümü)
rustls = { version = "0.20", features = ["dangerous_configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
getrandom = "0.2"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
flate2 = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "unwind" (varsayılan): tek bir istekteki hata yakalanır, portal düşmez
