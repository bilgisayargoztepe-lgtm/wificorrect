# WifiCorrect müşteri ağı: DHCP + DNS yalnızca br-hotspot üzerinde (dükkân ağına DHCP verilmez)
interface=br-hotspot
bind-dynamic
dhcp-authoritative
dhcp-range=10.50.0.20,10.50.0.249,255.255.255.0,2h
dhcp-option=option:router,10.50.0.1
dhcp-option=option:dns-server,10.50.0.1
domain-needed
bogus-priv
cache-size=1000
# 5651 DNS kaydı için (kaydedici yazılınca okunacak)
log-queries=extra
# 5651 DHCP kaydı ve IP değişince oturum taşıma
dhcp-script=/usr/local/lib/wificorrect/dhcp-script
# Yasaklı siteler (panel → Yasaklı siteler; wificorrect ctl filtre-uygula üretir)
conf-file=/etc/wificorrect/yasak-siteler.conf
# Hazır engel listeleri (panel → Yasaklı siteler → Hazır listeler; wificorrect ctl liste-uygula üretir, SIGHUP ile
# yeniden okunur). Dosya yoksa dnsmasq açılmaz: paket kurulumu boş dosya oluşturur.
servers-file=/etc/wificorrect/hazir-liste.conf
