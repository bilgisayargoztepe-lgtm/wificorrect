# DNS sorgu kayıtları 5651 için okunuyor: günlüğün servis başına hız sınırı satır düşürmesin
[Service]
LogRateLimitIntervalSec=0
# hazır engel listeleri (servers-file): dosya yoksa dnsmasq açılmaz → her açılışta boş dosya garanti edilir
ExecStartPre=/bin/sh -c '[ -e /etc/wificorrect/hazir-liste.conf ] || install -m 644 /dev/null /etc/wificorrect/hazir-liste.conf'
# çalışan dnsmasq'ın PID'i + okuduğu ayarın özeti (postinst ayar değiştiyse ya da geri dönüş olduysa yeniden başlatır)
ExecStartPost=-/bin/sh /usr/local/lib/wificorrect/dnsmasq-ozet
