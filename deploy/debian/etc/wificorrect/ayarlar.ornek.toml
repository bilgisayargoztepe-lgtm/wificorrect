# WifiCorrect ayarları — örnek. Cihazdaki asıl dosya: /etc/wificorrect/ayarlar.toml (izin 600).
# Kafeye özel değerler (kafe adı, SMS bilgileri) kalıba girmez; sahiplendirme ekranı / panel yazar.
# Eksik anahtar varsayılanı alır (src/ayar.rs).

[main]
site_name = "Kafe"
router_ip = "10.50.0.1"
subnet = "10.50.0.0/24"
portal_port = 8080
session_minutes = 43200        # 30 gün; müşteriye gösterilmez
max_devices_per_phone = 3
retention_days = 730            # kayıtlar cihazda 2 yıl (yalnızca yedeklenmiş günler silinir)
log_root = "/srv/5651"
state_root = "/srv/hotspot/state"
leases_file = "/var/lib/misc/dnsmasq.leases"

[sms]                          # Doğrulama SMS'i yönetim merkezinden gider; NetGSM / Twilio ayarları merkezde (cihazda yok).
mock = true                    # merkezdeki deneme modu (bağlı cihazda eşitlemede merkezden gelir; Özet uyarısı, sağlık raporu)

[limits]
otp_ttl_sec = 180
otp_max_attempts = 5
resend_cooldown_sec = 60
sms_per_phone_15min = 3
sms_per_phone_day = 10
sms_per_mac_hour = 5
sms_global_day = 300
verify_fail_lock_min = 15

[backup]                       # uzak yedek: arşiv sunucusu kurulunca açılacak
enabled = false
target = ""                    # kafe-<ad>@<sunucu>:
ssh = "ssh -i /etc/wificorrect/yedek_anahtar -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
