# BIOS menüsü (ISO'nun /isolinux/isolinux.cfg'sinin yerine; Debian'ın grafik/gelişmiş girişleri kalmaz). Zaman aşımı yok.
path
default vesamenu.c32
prompt 0
timeout 0
menu title WifiCorrect kurulum
label wificorrect
  menu label WifiCorrect kur - DISKTEKI HER SEY SILINIR
  menu default
  kernel /install.amd/vmlinuz
  append auto=true priority=critical locale=tr_TR.UTF-8 keyboard-configuration/xkb-keymap=tr vga=788 initrd=/install.amd/initrd.gz ---
