[package]
name = "wificorrect-merkez"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "WifiCorrect yönetim merkezi (Python merkezinin Rust karşılığı)"
publish = false

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
# preserve_order: save_json Python gibi anahtar sırasını korur
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
flate2 = "1"
getrandom = "0.2"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Test derlemelerinde PBKDF2 (120 000 yineleme) hızlı olsun: genel tür parametreleri bu pakette somutlaşır, bu yüzden
# bağımlılıklar ("*") değil kendi paketimiz hafif optimize edilir
[profile.dev.package.wificorrect-merkez]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
