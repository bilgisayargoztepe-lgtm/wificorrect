.marka{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:440px;margin:0 auto;padding:18px 24px 0;font:600 .8125rem/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.marka span{display:inline-block;min-width:0;padding:7px 10px;border-radius:6px;background:rgba(14,38,66,.55)}
.dil{flex:none;padding:2px 4px;border-radius:6px;background:rgba(14,38,66,.55)}
.dil a{display:inline-block;padding:5px 6px;color:#fff;text-decoration:none;opacity:.7}
.dil a[aria-current]{opacity:1;text-decoration:underline;text-underline-offset:3px}
main{position:relative;flex:none;width:calc(100% - 24px);max-width:440px;margin:-150px auto 0;padding:28px 22px 26px;background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(20,30,25,.06),0 14px 36px rgba(20,30,25,.14)}
h1{margin:0 0 10px;font:650 1.625rem/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.015em;color:var(--murekkep)}
p{margin:0 0 16px}
strong{color:var(--murekkep)}
a{color:var(--vurgu);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:3px}
form{margin-top:8px}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.9375rem;color:var(--murekkep)}
input[type=text],input[type=tel],input[type=password]{display:block;width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;color:var(--murekkep);font:inherit;font-size:1.0625rem}
input::placeholder{color:#8a95a1}
input[type=text]:focus,input[type=tel]:focus,input[type=password]:focus{outline:2px solid var(--vurgu);outline-offset:-1px;border-color:var(--vurgu)}
.madde{margin-top:18px;padding-top:16px;border-top:1px solid #eceeeb}
.madde + .madde{margin-top:0;border-top:0;padding-top:12px}
.onay{display:flex;gap:12px;align-items:flex-start;margin:0;font-weight:400;font-size:.9375rem;color:var(--govde);line-height:1.5}
details{margin:6px 0 0 34px}
.madde > details:first-child{margin-left:0}
details.gelismis{margin:18px 0 0}
summary{display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--bag);font-size:.9375rem;font-weight:600;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;margin-left:2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.metin{max-height:45vh;overflow:auto;margin:6px 0 4px;padding:12px 14px;border-radius:10px;background:#f6f7f5;border:1px solid #e6e9e6;font-size:.875rem;line-height:1.55;color:var(--govde)}
.metin p{margin:0 0 10px}.metin p:last-child{margin:0}
.metin ul{margin:0 0 10px;padding-left:20px}.metin li{margin:2px 0}.metin ul:last-child{margin-bottom:0}
.onay input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--vurgu)}
button{display:block;width:100%;min-height:52px;margin-top:26px;border:1px solid var(--vurgu);border-radius:10px;background:var(--vurgu);color:#fff;font:inherit;font-size:1.0625rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--vurgu-koyu)}
button.ikincil{margin-top:12px;background:#fff;color:var(--vurgu);border-color:var(--cizgi)}
button.ikincil:active{background:var(--gok)}
a.dugme{display:flex;align-items:center;justify-content:center;min-height:52px;margin:0 0 8px;border:1px solid var(--vurgu);border-radius:10px;background:#fff;color:var(--vurgu);font-size:1.0625rem;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
a.dugme:active{background:var(--gok)}
fieldset{margin:18px 0 0;padding:0;border:0}legend{padding:0;margin:0 0 8px;font-weight:600;font-size:.9375rem;color:var(--murekkep)}
.secenek{display:flex;gap:20px;flex-wrap:wrap}.secenek .onay input{accent-color:var(--vurgu)}
select#uyruk{display:block;width:100%;min-height:50px;padding:0 10px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;color:var(--murekkep);font:inherit;font-size:1rem}
form.servis select{display:block;width:100%;min-height:50px;padding:0 10px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;color:var(--murekkep);font:inherit;font-size:1rem}
form.misafir:has(input[value=pasaport]:checked) .alan-tc,form.misafir:has(input[value=tc]:checked) .alan-pasaport{display:none}
.hata{margin:6px 0 0;color:var(--hata);font-size:.9375rem}
.hata.genel{margin:0 0 16px;padding:12px 14px;border-left:3px solid var(--hata);border-radius:0 8px 8px 0;background:var(--hata-acik);color:#8c1d17}
.not{margin:12px 0 0;font-size:.9375rem;color:var(--soluk)}
