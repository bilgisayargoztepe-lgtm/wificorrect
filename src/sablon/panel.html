<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$baslik · $site Yönetim</title>
<style>
:root{color-scheme:light;
--zemin:#fff;--ray:#fafaf8;--yuzey:#f6f6f3;--ust:#f1f1ed;
--murekkep:#1d1d1b;--murekkep2:#45453f;--soluk:#6b6b64;
--cizgi:#e8e7e2;--cizgi2:#d5d4ce;
--vurgu:#c4161c;--vurgu-koyu:#9e1015;--vurgu-acik:#fdf0f0;
--koyu:#232323;--koyu2:#3a3a3a;--koyu3:#4a4a4a;--koyu-yazi:#d6d6d6;
--tehlike:#9a2a1f;--tehlike-acik:#fbf1ef;--iyi:#2f7a4f;--iyi-acik:#f1f7f3;--dikkat:#b7791f;
--yazi:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
--es:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--hiz:160ms cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:15px/1.55 var(--yazi);-webkit-font-smoothing:antialiased}
a{color:var(--vurgu);text-decoration:underline;text-decoration-color:rgba(196,22,28,.35);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--vurgu-koyu);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}

/* iskelet: koyu üst şerit + koyu kenar menüsü + içerik */
.ust{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;min-height:52px;padding:0 20px;background:var(--koyu);color:#fff}
.marka{font-weight:700;font-size:1.0625rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.marka span{font-weight:400;color:#a8a8a8}
.ust-sag{display:flex;align-items:center;gap:16px;margin-left:auto}
.kim{font-size:.8125rem;color:var(--koyu-yazi);text-align:right;overflow-wrap:anywhere}
.kim span{color:#9a9a9a}
.kim span::before{content:" · "}
.ust form{margin:0}
.ust form button{min-height:32px;padding:0 12px;background:transparent;border-color:#5a5a5a;color:#fff;box-shadow:none}
.ust form button:hover{background:var(--koyu2);border-color:#777;color:#fff}
.menu-dugme{display:none}
.kabuk{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 52px)}
.yan{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;background:var(--koyu2);padding:18px 0}
.yan nav{display:flex;flex-direction:column}
.yan nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 20px;border-left:3px solid transparent;color:var(--koyu-yazi);text-decoration:none;font-size:.9375rem;transition:background-color var(--hiz),color var(--hiz)}
.yan nav a svg{width:18px;height:18px;flex:none;opacity:.8}
svg.simge{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.yan nav a:hover{background:var(--koyu3);color:#fff}
.yan nav a.aktif{background:var(--vurgu);border-left-color:#ff8a8a;color:#fff;font-weight:600}
.yan nav a.aktif svg{opacity:1}
/* durum rozeti: o an bağlı = dolu yeşil, değil = soluk */
.rozet{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;background:var(--ust);color:var(--soluk);font-size:.8125rem;font-weight:600;white-space:nowrap}
.rozet.bagli{background:var(--iyi);color:#fff}
.rozet.bagli::before{content:"";width:6px;height:6px;margin-right:6px;border-radius:50%;background:#fff}
/* grup sayfası: üstte bölümlere atlama, bölümler alt alta (başlık + ince çizgi) */
.bolum{margin:0 0 24px;padding:22px 20px 20px;border:1px solid var(--cizgi2);background:var(--zemin);scroll-margin-top:68px}
.bolum > :last-child{margin-bottom:0}
.bolum-baslik{margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--cizgi);color:var(--vurgu);font-size:1.125rem;font-weight:500}
.bolum .kart:last-child{margin-bottom:0}
main{min-width:0;padding:24px 28px 72px;max-width:1320px}
h1{margin:0 0 24px;padding:12px 16px;background:var(--yuzey);border-radius:2px;font-size:1rem;font-weight:500;color:var(--murekkep2);line-height:1.3;overflow-wrap:anywhere}
h2{margin:0 0 14px;font-size:1rem;font-weight:600;letter-spacing:-.005em}
p{margin:0 0 12px}

/* bölümler: kutu yok, yalnızca boşluk ve ince çizgi */
.kart{margin:0 0 36px}
.kart + .kart{border-top:1px solid var(--cizgi);padding-top:30px}
.dar{max-width:28rem}
form.satir.kart{margin-bottom:20px}

/* özet: kısayol kutuları, çerçeveli kutular, sayılar, halkalar */
.kisayol{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;margin:0 0 24px}
.kisayol a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:76px;padding:12px 8px;border:1px solid var(--cizgi2);background:var(--yuzey);color:var(--murekkep);text-decoration:none;font-size:.875rem;line-height:1.25;text-align:center;transition:background-color var(--hiz),border-color var(--hiz)}
.kisayol a svg{width:26px;height:26px;color:var(--koyu3)}
.kisayol a:hover{background:var(--zemin);border-color:var(--koyu3)}
.ozet-izgara{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;margin:0 0 24px}
.ozet-sag{display:grid;gap:24px}
.kutu{border:1px solid var(--cizgi2);background:var(--zemin);padding:22px 20px 14px}
.kutu > h2{margin:0 0 6px;padding-bottom:14px;border-bottom:1px solid var(--cizgi);color:var(--vurgu);font-size:1.125rem;font-weight:500}
.kutu > .not{margin:12px 0 6px}
@media (max-width:820px){.bolum{padding:18px 16px 16px;margin-bottom:16px}}
.ozet-uyari{margin:0 0 24px}
.liste{list-style:none;margin:0;padding:0}
.liste li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:.9375rem;font-variant-numeric:tabular-nums}
.liste li + li{border-top:1px solid var(--cizgi)}
.liste li span{color:var(--soluk);text-align:right;white-space:nowrap}
.liste li b{font-weight:500;overflow-wrap:anywhere}
.tumu{display:block;padding:10px 0 4px;font-size:.875rem}
.sayilar{margin:0}
.sayilar div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0}
.sayilar div + div{border-top:1px solid var(--cizgi)}
.sayilar dt{font-size:.9375rem}
.sayilar dd{margin:0;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.halkalar{display:flex;flex-wrap:wrap;justify-content:space-around;gap:24px;padding:16px 0 8px}
.halka{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.9375rem;text-align:center}
.halka b{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--iyi) calc(var(--p) * 1%),var(--cizgi) 0);font-weight:500;font-variant-numeric:tabular-nums}
.halka b::before{content:"";grid-area:1/1;width:80px;height:80px;border-radius:50%;background:var(--zemin)}
.halka b span{grid-area:1/1;position:relative}
.halka.dolu b{background:conic-gradient(var(--tehlike) calc(var(--p) * 1%),var(--cizgi) 0)}
.halka small{color:var(--soluk)}

/* anahtar–değer listesi */
.bilgi{margin:0 0 12px;max-width:44rem}
.bilgi div{display:grid;grid-template-columns:minmax(9rem,15rem) minmax(0,1fr);gap:16px;padding:10px 0}
.bilgi div + div{border-top:1px solid var(--cizgi)}
.bilgi dt{color:var(--soluk);font-size:.875rem}
.bilgi dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.durum::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 8px 1px 0;background:var(--iyi)}
.durum.kotu{color:var(--tehlike);font-weight:600}
.durum.kotu::before{background:var(--tehlike)}

/* uyarılar: sade metin + nokta */
.uyarilar{list-style:none;margin:0;padding:0;max-width:52rem}
.uyarilar li{position:relative;padding:8px 0 8px 20px}
.uyarilar li + li{border-top:1px solid var(--cizgi)}
.uyarilar li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--dikkat)}

/* tablolar */
.tablo{overflow-x:auto;margin:0 0 8px}
.not + .tablo{margin-top:20px}
table{width:auto;min-width:min(100%,46rem);border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 20px 8px 0;white-space:nowrap}
th:last-child,td:last-child{padding-right:0}
th{font-size:.8125rem;font-weight:600;color:var(--soluk);border-bottom:1px solid var(--cizgi2)}
td{border-bottom:1px solid var(--cizgi);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}

/* formlar */
label{display:block;margin:16px 0 6px;font-size:.875rem;font-weight:600;color:var(--murekkep)}
input[type=text],input[type=password],input[type=number],select{display:block;width:100%;max-width:28rem;min-height:40px;padding:8px 12px;border:1px solid var(--cizgi2);border-radius:6px;background:var(--zemin);color:var(--murekkep);font:inherit;font-size:.9375rem;transition:border-color var(--hiz)}
textarea{display:block;width:100%;max-width:52rem;min-height:12rem;padding:10px 12px;border:1px solid var(--cizgi2);border-radius:6px;background:var(--zemin);color:var(--murekkep);font:inherit;font-size:.9375rem;line-height:1.55;resize:vertical}
textarea:focus{outline:2px solid var(--vurgu);outline-offset:-1px;border-color:var(--vurgu)}
input::placeholder{color:#8c8c85}
input:hover,select:hover{border-color:#bdbcb5}
input:focus,select:focus{outline:2px solid var(--vurgu);outline-offset:-1px;border-color:var(--vurgu)}
label.secim{display:flex;align-items:center;gap:10px;min-height:36px;margin:12px 0 0;font-weight:400;font-size:.9375rem;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--vurgu)}
.satir{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.satir label{margin:0 0 6px}
.satir input,.satir select{width:15rem}
.satir + .not{margin-top:14px}
.satir button{min-height:40px}
.grup{display:grid;grid-template-columns:13rem minmax(0,28rem);gap:0 48px}
.grup h2{margin-top:2px}
.grup > div > :first-child{margin-top:0}
.kaydet{border-top:1px solid var(--cizgi);padding:24px 0 0 calc(13rem + 48px)}
.kaydet .not{margin-top:12px}
.kaydet.tek{padding-left:0}
td input.kisa{display:inline-block;width:10rem;min-height:32px;padding:4px 10px;font-size:.8125rem;vertical-align:middle}

/* düğmeler: gerçek kontrol görünümü, hap değil */
button,.dugme{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border:1px solid var(--vurgu);border-radius:6px;background:var(--vurgu);color:#fff;font:inherit;font-size:.875rem;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.05);transition:background-color var(--hiz),border-color var(--hiz),color var(--hiz)}
button:hover,.dugme:hover{background:var(--vurgu-koyu);border-color:var(--vurgu-koyu);color:#fff}
button:active{transform:translateY(.5px)}
button.ikincil,.dugme.ikincil{background:var(--zemin);color:var(--murekkep);border-color:var(--cizgi2)}
button.ikincil:hover,.dugme.ikincil:hover{background:var(--yuzey);border-color:#bdbcb5;color:var(--murekkep)}
button.tehlike{background:var(--zemin);color:var(--tehlike);border-color:#e2c3be}
button.tehlike:hover{background:var(--tehlike-acik);border-color:var(--tehlike);color:var(--tehlike)}
form.ic{display:inline}
td button{min-height:32px;padding:0 12px;font-size:.8125rem}
td label.secim{display:inline-flex;min-height:32px;margin:0 6px 0 4px;font-size:.8125rem;vertical-align:middle}
.eylemler{display:flex;flex-wrap:wrap;gap:8px}

.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* geri bildirim */
.mesaj{margin:-8px 0 28px;padding:11px 16px;border-left:3px solid var(--iyi);background:var(--iyi-acik);border-radius:0 6px 6px 0;max-width:52rem}
.mesaj.hata{border-left-color:var(--tehlike);background:var(--tehlike-acik);color:var(--murekkep);font-size:inherit;margin:-8px 0 28px}
.hata{margin:6px 0 0;color:var(--tehlike);font-size:.8125rem}
p.hata{font-size:.875rem;font-weight:500}
.not{color:var(--soluk);font-size:.875rem;max-width:70ch}
pre{margin:0;padding:14px 16px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:6px;font:12.5px/1.6 var(--es);white-space:pre-wrap;overflow-wrap:anywhere}
code{font:.8125rem var(--es)}

/* giriş / kurulum: menüsüz, ortalanmış */
.yalin{background:var(--yuzey)}
.yalin .ust{position:static;justify-content:center}
.yalin .kabuk{display:block;min-height:0;padding:10vh 16px 48px}
.yalin .yan{display:none}
.yalin main{max-width:24rem;margin:0 auto;padding:32px;background:var(--zemin);border:1px solid var(--cizgi);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04)}
.yalin .kart{margin:0}
.yalin .kart p:last-child{margin:0}
.yalin h1{font-size:1.375rem;margin-bottom:8px}
.yalin input{max-width:none}
.yalin form button{width:100%;min-height:42px;margin-top:12px}

@media (max-width:1100px){.kisayol{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
.ust{padding:0 12px 0 4px;gap:8px}
.menu-dugme{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;color:#fff;cursor:pointer}
.menu-dugme svg{width:24px;height:24px}
.kim{display:none}
.kabuk{display:block}
.yan{display:none;position:sticky;top:52px;z-index:4;height:auto;max-height:calc(100vh - 52px);padding:6px 0}
#menu-ac:checked ~ .kabuk .yan{display:block}
#menu-ac:focus-visible ~ .ust .menu-dugme{outline:2px solid #fff;outline-offset:-4px}

main{padding:16px 16px 56px}
.kisayol{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ozet-izgara{grid-template-columns:minmax(0,1fr);gap:16px}
.ozet-sag{gap:16px}
.kutu{padding:18px 16px 10px}
.satir > div{flex:1 1 100%}
.grup{display:block}
.grup h2{margin-bottom:4px}
.grup > div > :first-child{margin-top:12px}
.kaydet{padding-left:0}
.satir input,.satir select{width:100%;max-width:none}
.bilgi div{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px}
.yalin .kabuk{padding-top:8vh}
.yalin .ust{padding:0 16px}
.yalin main{padding:24px 20px}
}
@media (pointer:coarse){button,.dugme{min-height:44px}.yan nav a{min-height:48px}td button{min-height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body class="$govde">
$menu_dugme_html<header class="ust">
$menu_etiket_html<div class="marka">$site <span>Yönetim</span></div>
$ust_html
</header>
<div class="kabuk">
<aside class="yan">$menu_html</aside>
<main>
<h1>$baslik</h1>
$mesaj_html
$icerik_html
</main>
</div></body>
</html>
